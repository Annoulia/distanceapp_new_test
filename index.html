<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FIRST in SPACE — Ближайший магазин</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .container {
      width: min(900px, calc(100% - 32px));
      margin: 0 auto;
      padding: 32px 0;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 700;
    }

    .subtitle {
      margin-bottom: 28px;
      color: #666;
      font-size: 15px;
    }

    .search-box {
      background: #fff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,.06);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .input-row {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      min-width: 0;
      height: 50px;
      padding: 0 16px;
      border: 1px solid #d5d5d5;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #111;
    }

    button {
      height: 50px;
      padding: 0 22px;
      border: 0;
      border-radius: 10px;
      background: #111;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .status {
      margin-top: 14px;
      font-size: 14px;
      color: #666;
      min-height: 20px;
    }

    .result {
      display: none;
      margin-top: 20px;
      background: #fff;
      padding: 22px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,.06);
    }

    .result h2 {
      margin: 0 0 20px;
      font-size: 20px;
    }

    .result-row {
      margin-bottom: 14px;
    }

    .result-label {
      display: block;
      margin-bottom: 4px;
      color: #777;
      font-size: 13px;
    }

    .result-value {
      font-size: 17px;
      font-weight: 600;
    }

    .category {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .category-a {
      background: #dff3e4;
      color: #176b2c;
    }

    .category-b {
      background: #fff2bf;
      color: #765d00;
    }

    .category-c {
      background: #ffdcdc;
      color: #9a1f1f;
    }

    .category-d {
      background: #dcecff;
      color: #14558c;
    }

    #map {
      height: 420px;
      margin-top: 20px;
      border-radius: 16px;
      overflow: hidden;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 16px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      color: #555;
    }

    .legend-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
    }

    .dot-a {
      background: #2e9d4d;
    }

    .dot-b {
      background: #e5bd21;
    }

    .dot-c {
      background: #d73737;
    }

    .dot-d {
      background: #3488d0;
    }

    .error {
      color: #b00020;
    }

    @media (max-width: 650px) {
      .container {
        width: min(100% - 20px, 900px);
        padding: 20px 0;
      }

      h1 {
        font-size: 24px;
      }

      .input-row {
        flex-direction: column;
      }

      button {
        width: 100%;
      }

      #map {
        height: 350px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>FIRST in SPACE</h1>

  <div class="subtitle">
    Поиск ближайшего магазина
  </div>

  <div class="search-box">

    <label for="address">
      Введите адрес
    </label>

    <div class="input-row">

      <input
        id="address"
        type="text"
        placeholder="Например: Абакан, ул. Некрасова, 22В"
        autocomplete="street-address"
      >

      <button id="searchButton">
        Найти ближайший
      </button>

    </div>

    <div id="status" class="status"></div>

  </div>


  <div id="result" class="result">

    <h2>Ближайший магазин</h2>

    <div class="result-row">
      <span class="result-label">Город</span>
      <div id="city" class="result-value"></div>
    </div>

    <div class="result-row">
      <span class="result-label">Адрес магазина</span>
      <div id="storeAddress" class="result-value"></div>
    </div>

    <div class="result-row">
      <span class="result-label">Категория</span>
      <div id="category"></div>
    </div>

    <div class="result-row">
      <span class="result-label">Расстояние</span>
      <div id="distance" class="result-value"></div>
    </div>

    <div id="map"></div>

    <div class="legend">

      <div class="legend-item">
        <span class="legend-dot dot-a"></span>
        A — Территория не закрыта за магазином
      </div>

      <div class="legend-item">
        <span class="legend-dot dot-b"></span>
        B — Закрытая территория, радиус 2 км
      </div>

      <div class="legend-item">
        <span class="legend-dot dot-c"></span>
        C — ГОРОД ЗАКРЫТ
      </div>

      <div class="legend-item">
        <span class="legend-dot dot-d"></span>
        D — Фирменный магазин FIRST in SPACE
      </div>

    </div>

  </div>

</div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

  const API_URL =
    "https://fn.tatnet.cloud/d81fff77-caeb-4e02-b374-407e2b3486f0/f55c92b9-2fb7-44a3-a0b7-0c7bc16ff784";


  const addressInput =
    document.getElementById("address");

  const searchButton =
    document.getElementById("searchButton");

  const status =
    document.getElementById("status");

  const result =
    document.getElementById("result");

  const city =
    document.getElementById("city");

  const storeAddress =
    document.getElementById("storeAddress");

  const category =
    document.getElementById("category");

  const distance =
    document.getElementById("distance");


  let map = null;
  let userMarker = null;
  let storeMarker = null;


  const categoryDescriptions = {

    A: "Территория не закрыта за магазином",

    B: "Закрытая территория, радиус 2 км",

    C: "ГОРОД ЗАКРЫТ",

    D: "Фирменный магазин FIRST in SPACE"

  };


  function categoryClass(value) {

    const letter =
      String(value || "")
        .trim()
        .toUpperCase();

    return "category-" + letter.toLowerCase();

  }


  function categoryText(value) {

    const letter =
      String(value || "")
        .trim()
        .toUpperCase();

    const description =
      categoryDescriptions[letter] || "";

    if (description) {

      return `Категория ${letter} — ${description}`;

    }

    return `Категория ${letter}`;

  }


  async function findNearest() {

    const address =
      addressInput.value.trim();


    if (!address) {

      status.textContent =
        "Введите адрес.";

      status.className =
        "status error";

      addressInput.focus();

      return;

    }


    searchButton.disabled = true;

    result.style.display = "none";

    status.className = "status";

    status.textContent =
      "Ищем ближайший магазин…";


    try {

      const response =
        await fetch(API_URL, {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify({

            action: "find_nearest",

            address: address

          })

        });


      const data =
        await response.json();


      if (!response.ok || !data.ok) {

        throw new Error(
          data.error ||
          "Не удалось выполнить поиск."
        );

      }


      if (!data.store) {

        throw new Error(
          "Ближайший магазин не найден."
        );

      }


      const store =
        data.store;


      city.textContent =
        store.city || "—";


      storeAddress.textContent =
        store.address || "—";


      category.className =
        "category " +
        categoryClass(store.category);


      category.textContent =
        categoryText(store.category);


      const distanceValue =
        Number(store.distanceKm);


      distance.textContent =
        Number.isFinite(distanceValue)
          ? `${distanceValue.toFixed(1)} км`
          : "—";


      result.style.display =
        "block";


      status.textContent =
        "Магазин найден.";


      showMap(
        data.user,
        store
      );

    }

    catch (error) {

      console.error(error);

      status.className =
        "status error";

      status.textContent =
        error.message ||
        "Произошла ошибка.";

    }

    finally {

      searchButton.disabled =
        false;

    }

  }


  function showMap(user, store) {

    if (!user || !store) {
      return;
    }


    /*
      ВАЖНО:

      Leaflet принимает координаты
      строго в формате:

      [latitude, longitude]

      То есть:

      [широта, долгота]

      Geoapify и S3 хранят их
      отдельно как:

      lat
      lon

      Поэтому здесь НИКОГДА
      не меняем их местами.
    */


    const userLat =
      Number(user.lat);

    const userLon =
      Number(user.lon);

    const storeLat =
      Number(store.lat);

    const storeLon =
      Number(store.lon);


    if (
      !Number.isFinite(userLat) ||
      !Number.isFinite(userLon) ||
      !Number.isFinite(storeLat) ||
      !Number.isFinite(storeLon)
    ) {

      console.error(
        "Некорректные координаты:",
        {
          userLat,
          userLon,
          storeLat,
          storeLon
        }
      );

      return;

    }


    /*
      Проверяем диапазон координат.
      Latitude: -90 ... 90
      Longitude: -180 ... 180
    */

    if (
      userLat < -90 ||
      userLat > 90 ||
      userLon < -180 ||
      userLon > 180 ||
      storeLat < -90 ||
      storeLat > 90 ||
      storeLon < -180 ||
      storeLon > 180
    ) {

      console.error(
        "Координаты вне допустимого диапазона."
      );

      return;

    }


    if (!map) {

      map = L.map("map");

      L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
          maxZoom: 19,
          attribution:
            "&copy; OpenStreetMap contributors"
        }
      ).addTo(map);

    }


    if (userMarker) {

      map.removeLayer(userMarker);

      userMarker = null;

    }


    if (storeMarker) {

      map.removeLayer(storeMarker);

      storeMarker = null;

    }


    /*
      ТОЧКА ПОЛЬЗОВАТЕЛЯ

      [LAT, LON]
    */

    userMarker =
      L.marker([
        userLat,
        userLon
      ])
      .addTo(map)
      .bindPopup(
        "<b>Ваш адрес</b>"
      );


    const storeCategory =
      String(store.category || "")
        .trim()
        .toUpperCase();


    const iconColors = {

      A: "#2e9d4d",

      B: "#e5bd21",

      C: "#d73737",

      D: "#3488d0"

    };


    const color =
      iconColors[storeCategory] ||
      "#111";


    const storeIcon =
      L.divIcon({

        className: "",

        html: `
          <div style="
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: ${color};
            border: 3px solid white;
            box-shadow: 0 2px 7px rgba(0,0,0,.35);
          "></div>
        `,

        iconSize: [22, 22],

        iconAnchor: [11, 11]

      });


    /*
      ТОЧКА МАГАЗИНА

      [LAT, LON]

      НЕ [LON, LAT]
    */

    storeMarker =
      L.marker(
        [
          storeLat,
          storeLon
        ],
        {
          icon: storeIcon
        }
      )
      .addTo(map)
      .bindPopup(
        `<b>${escapeHtml(store.city || "")}</b><br>
         ${escapeHtml(store.address || "")}`
      );


    /*
      Показываем на карте
      и пользователя, и магазин.
    */

    const bounds =
      L.latLngBounds([

        [
          userLat,
          userLon
        ],

        [
          storeLat,
          storeLon
        ]

      ]);


    map.fitBounds(
      bounds,
      {
        padding: [40, 40],
        maxZoom: 15
      }
    );


    /*
      После показа карты Leaflet иногда
      требуется пересчитать размеры,
      особенно на мобильном.
    */

    setTimeout(() => {

      if (map) {
        map.invalidateSize();
      }

    }, 100);

  }


  function escapeHtml(value) {

    return String(value)

      .replaceAll(
        "&",
        "&amp;"
      )

      .replaceAll(
        "<",
        "&lt;"
      )

      .replaceAll(
        ">",
        "&gt;"
      )

      .replaceAll(
        '"',
        "&quot;"
      )

      .replaceAll(
        "'",
        "&#039;"
      );

  }


  searchButton.addEventListener(
    "click",
    findNearest
  );


  addressInput.addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {

        findNearest();

      }

    }
  );

</script>

</body>
</html>
