      <button

      >

        class="filter-btn"

      >

      </button>

        class="filter-btn"

      >

      </button>

    <div id="map"></div>


    <div class="legend">


      <div class="legend-item">

        <span class="legend-dot a"></span>

        <div>

          <strong>A</strong><br>

          За этим адресом территория
          не закрыта

        </div>

      </div>


      <div class="legend-item">

        <span class="legend-dot b"></span>

        <div>

          <strong>B</strong><br>

          За магазином закрыта
          территория радиусом 2 км

        </div>

      </div>


      <div class="legend-item">

        <span class="legend-dot c"></span>

        <div>

          <strong>C</strong><br>

          ГОРОД ЗАКРЫТ

        <span class="legend-dot d"></span>

<script>


const API_URL =
  "https://fn.tatnet.cloud/d81fff77-caeb-4e02-b374-407e2b3486f0/f55c92b9-2fb7-44a3-a0b7-0c7bc16ff784";


const GEOAPIFY_KEY =
  "2a439c56d224427497d809155bdc6769";


let stores =
  [];

let map =
  null;

let storeMarkers =
  [];

let userMarker =
  null;

let currentFilter =
  "ALL";


const CATEGORY_INFO = {

  A: {

    comment:
      "За этим адресом территория не закрыта",

    color:
      "#159447"

  },

  B: {

    comment:
      "За магазином закрыта территория радиусом 2 км",

    color:
      "#e2a900"

  },

  C: {

    comment:
      "ГОРОД ЗАКРЫТ",

    color:
      "#d83a3a"

  },

  D: {

    comment:
      "Фирменный магазин First in Space",

    color:
      "#111111"

  }

};


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(
  message,
  type = ""
) {

  const element =
    document.getElementById(
      "status"
    );

  element.textContent =
    message;

  element.className =
    "status " +
    type;

}


/* =========================================================
   ESCAPE
   ========================================================= */

function escapeHtml(
  value
) {

  return String(
    value || ""
  )
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================================================
   API
   ========================================================= */

async function api(
  payload
) {

  const response =
    await fetch(
      API_URL,
      {

        method:
          "POST",

        headers: {

          "Content-Type":
            "application/json"

        },

        body:
          JSON.stringify(
            payload
          )

      }
    );


  const text =
    await response.text();


  let data;

  try {

    data =
      JSON.parse(
        text
      );

  } catch {

    throw new Error(
      "Сервер вернул некорректный ответ."
    );

  }


  if (!response.ok) {

    throw new Error(
      data.error ||
      "HTTP " +
      response.status
    );

  }


  if (
    data.ok === false
  ) {

    throw new Error(
      data.error ||
      "Ошибка API."
    );

  }


  return data;

}


/* =========================================================
   LOAD STORES
   ========================================================= */

async function loadStores() {

  setStatus(
    "Загружаем актуальную базу..."
  );


  try {

    const data =
      await api({

        action:
          "stores"

      });


    stores =
      Array.isArray(
        data.stores
      )
        ? data.stores
        : [];


    if (!stores.length) {

      throw new Error(
        "База пока пустая. Сначала загрузите Excel через админку."
      );

    }


    drawStoreMarkers();


    setStatus(

      "База загружена. Адресов: " +
      stores.length,

      "success"

    );

  } catch (
    error
  ) {

    console.error(
      error
    );


    setStatus(

      error.message,

      "error"

    );

  }

}


/* =========================================================
   DISTANCE
   ========================================================= */

function toRadians(
  degrees
) {

  return (
    degrees *
    Math.PI /
    180
  );

}


function distanceKm(
  lat1,
  lon1,
  lat2,
  lon2
) {

  const R =
    6371;


  const dLat =
    toRadians(
      lat2 -
      lat1
    );


  const dLon =
    toRadians(
      lon2 -
      lon1
    );


  const a =

    Math.sin(
      dLat / 2
    ) ** 2 +

    Math.cos(
      toRadians(
        lat1
      )
    ) *

    Math.cos(
      toRadians(
        lat2
      )
    ) *

    Math.sin(
      dLon / 2
    ) ** 2;


  const c =
    2 *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(
        1 - a
      )
    );


  return R * c;

}


/* =========================================================
   MARKER ICON
   ========================================================= */

function createMarkerIcon(
  category
) {

  const color =
    CATEGORY_INFO[
      category
    ]?.color ||
    "#111";


  return L.divIcon({

    className:
      "store-marker",

    html:
      `
        <div
          style="
            width:22px;
            height:22px;
            border-radius:50%;
            background:${color};
            border:3px solid white;
            box-shadow:0 2px 6px rgba(0,0,0,.35);
          "
        ></div>
      `,

    iconSize:
      [
        22,
        22
      ],

    iconAnchor:
      [
        11,
        11
      ]

  });

}


/* =========================================================
   CLEAR MARKERS
   ========================================================= */

function clearStoreMarkers() {

  storeMarkers.forEach(
    marker => {

      try {

        map.removeLayer(
          marker
        );

      } catch {}

    }
  );


  storeMarkers =
    [];

}


/* =========================================================
   DRAW
   ========================================================= */

function drawStoreMarkers() {

  if (!map) {
    return;
  }


  clearStoreMarkers();


  const visible =
    stores.filter(
      store => {

        const lat =
          Number(
            store.lat
          );

        const lon =
          Number(
            store.lon
          );


        if (
          !Number.isFinite(
            lat
          ) ||
          !Number.isFinite(
            lon
          )
        ) {

          return false;

        }


        if (
          currentFilter ===
          "ALL"
        ) {

          return true;

        }


        return (

          String(
            store.category ||
            ""
          )
            .toUpperCase() ===
          currentFilter

        );

      }
    );


  visible.forEach(
    store => {

      const category =
        String(
          store.category ||
          "A"
        )
          .toUpperCase();


      const marker =
        L.marker(

          [
            Number(
              store.lat
            ),

            Number(
              store.lon
            )
          ],

          {

            icon:
              createMarkerIcon(
                category
              )

          }

        );


      const info =
        CATEGORY_INFO[
          category
        ] ||
        CATEGORY_INFO.A;


      marker.bindPopup(

        `
          <div
            style="
              min-width:190px;
              font-family:Arial,sans-serif;
            "
          >

            <div
              style="
                font-weight:800;
                font-size:16px;
                margin-bottom:7px;
              "
            >
              ${escapeHtml(
                store.city
              )}
            </div>

            <div
              style="
                font-size:14px;
                line-height:1.4;
                margin-bottom:8px;
              "
            >
              ${escapeHtml(
                store.address
              )}
            </div>

            <div
              style="
                display:inline-block;
                padding:5px 9px;
                border-radius:999px;
                background:${info.color};
                color:${category === "B" ? "#111" : "#fff"};
                font-weight:800;
                font-size:12px;
              "
            >
              Категория ${escapeHtml(
                category
              )}
            </div>

            <div
              style="
                margin-top:8px;
                font-size:13px;
                line-height:1.4;
              "
            >
              ${escapeHtml(
                info.comment
              )}
            </div>

          </div>
        `

      );


      marker.addTo(
        map
      );


      storeMarkers.push(
        marker
      );

    }
  );

}


/* =========================================================
   USER MARKER
   ========================================================= */

function showUserMarker(
  lat,
  lon
) {

  if (
    userMarker
  ) {

    try {

      map.removeLayer(
        userMarker
      );

    } catch {}

  }


  userMarker =
    L.marker(

      [
        lat,
        lon
      ],

      {

        icon:
          L.divIcon({

            className:
              "user-marker",

            html:
              `
                <div
                  style="
                    width:18px;
                    height:18px;
                    border-radius:50%;
                    background:#111;
                    border:4px solid white;
                    box-shadow:0 2px 8px rgba(0,0,0,.45);
                  "
                ></div>
              `,

            iconSize:
              [
                18,
                18
              ],

            iconAnchor:
              [
                9,
                9
              ]

          }),

        zIndexOffset:
          1000

      }

    );


  userMarker
    .addTo(
      map
    );

}


/* =========================================================
   RESULT
   ========================================================= */

function showResult(
  store,
  distance
) {

  const result =
    document.getElementById(
      "result"
    );


  const category =
    String(
      store.category ||
      "A"
    )
      .toUpperCase();


  const info =
    CATEGORY_INFO[
      category
    ] ||
    CATEGORY_INFO.A;


  result.style.display =
    "block";


  result.innerHTML =

    `

      <div class="result-title">
        Ближайший магазин
      </div>

      <div class="distance">
        ${distance.toFixed(1)} км
      </div>

      <div class="result-address">
        ${escapeHtml(
          [
            store.region,
            store.city,
            store.address
          ]
            .filter(Boolean)
            .join(", ")
        )}
      </div>

      <span
        class="
          category-badge
          ${
            category === "A"
              ? "category-a"
              : ""
          }
          ${
            category === "B"
              ? "category-b"
              : ""
          }
          ${
            category === "C"
              ? "category-c"
              : ""
          }
          ${
            category === "D"
              ? "category-d"
              : ""
          }
        "
      >
        Категория
        ${escapeHtml(
          category
        )}
      </span>

      <div class="category-comment">
        ${escapeHtml(
          info.comment
        )}
      </div>

    `;

}


/* =========================================================
   GEOCODE USER
   ========================================================= */

async function geocodeAddress(
  address
) {

  let query =
    address;


  const lower =
    address.toLowerCase();


  if (
    !lower.includes(
      "россия"
    ) &&
    !lower.includes(
      "russia"
    )
  ) {

    query +=
      ", Россия";

  }


  const url =

    "https://api.geoapify.com/v1/geocode/search" +

    "?text=" +
    encodeURIComponent(
      query
    ) +

    "&filter=countrycode:ru" +

    "&limit=1" +

    "&format=json" +

    "&apiKey=" +
    encodeURIComponent(
      GEOAPIFY_KEY
    );


  const response =
    await fetch(
      url
    );


  if (
    !response.ok
  ) {

    throw new Error(
      "Geoapify HTTP " +
      response.status
    );

  }


  const data =
    await response.json();


  if (
    !data.results ||
    !data.results.length
  ) {

    throw new Error(
      "Geoapify не нашёл этот адрес."
    );

  }


  const result =
    data.results[0];


  return {

    lat:
      Number(
        result.lat
      ),

    lon:
      Number(
        result.lon
      ),

    formatted:
      result.formatted ||
      address

  };

}


/* =========================================================
   SEARCH
   ========================================================= */

async function findNearest() {

  const input =
    document
      .getElementById(
        "address"
      )
      .value
      .trim();


  if (!input) {

    alert(
      "Введите адрес."
    );

    return;

  }


  const valid =
    stores.filter(
      store =>

        Number.isFinite(
          Number(
            store.lat
          )
        ) &&

        Number.isFinite(
          Number(
            store.lon
          )
        )

    );


  if (!valid.length) {

    alert(
      "В базе нет адресов с координатами."
    );

    return;

  }


  const button =
    document.getElementById(
      "searchBtn"
    );


  button.disabled =
    true;


  setStatus(
    "Определяем координаты адреса..."
  );


  try {

    const user =
      await geocodeAddress(
        input
      );


    let nearest =
      null;

    let min =
      Infinity;


    valid.forEach(
      store => {

        const distance =
          distanceKm(

            user.lat,
            user.lon,

            Number(
              store.lat
            ),

            Number(
              store.lon
            )

          );


        if (
          distance <
          min
        ) {

          min =
            distance;

          nearest =
            store;

        }

      }
    );


    if (!nearest) {

      throw new Error(
        "Ближайший магазин не найден."
      );

    }


    showResult(
      nearest,
      min
    );


    showUserMarker(
      user.lat,
      user.lon
    );


    map.setView(

      [
        user.lat,
        user.lon
      ],

      12

    );


    userMarker
      .bindPopup(

        `
          <strong>
            Ваш адрес
          </strong>
          <br>
          ${escapeHtml(
            user.formatted
          )}
        `

      )
      .openPopup();


    setStatus(
      "Адрес найден.",
      "success"
    );


  } catch (
    error
  ) {

    console.error(
      error
    );


    setStatus(
      "Ошибка: " +
      error.message,
      "error"
    );

  } finally {

    button.disabled =
      false;

  }

}


/* =========================================================
   MAP
   ========================================================= */

function initializeMap() {

  map =
    L.map(
      "map"
    ).setView(

      [
        55.7558,
        37.6173
      ],

      5

    );


  L.tileLayer(

    "https://maps.geoapify.com/v1/tile/osm-bright/{z}/{x}/{y}.png" +

    "?apiKey=" +
    encodeURIComponent(
      GEOAPIFY_KEY
    ),

    {

      maxZoom:
        20,

      attribution:
        'Powered by <a href="https://www.geoapify.com/" target="_blank">Geoapify</a> | © <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a> contributors'

    }

  ).addTo(
    map
  );

}


/* =========================================================
   FILTERS
   ========================================================= */

document
  .querySelectorAll(
    ".filter-btn"
  )
  .forEach(
    button => {

      button.addEventListener(
        "click",
        function() {

          document
            .querySelectorAll(
              ".filter-btn"
            )
            .forEach(
              btn =>
                btn.classList.remove(
                  "active"
                )
            );


          this.classList.add(
            "active"
          );


          currentFilter =
            this.dataset.category;


          drawStoreMarkers();

        }
      );

    }
  );


/* =========================================================
   EVENTS
   ========================================================= */

document
  .getElementById(
    "searchBtn"
  )
  .addEventListener(
    "click",
    findNearest
  );


document
  .getElementById(
    "address"
  )
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key ===
        "Enter"
      ) {

        findNearest();

      }

    }
  );


/* =========================================================
   START
   ========================================================= */

initializeMap();

loadStores();

</script>

</body>
</html>
