<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Админка — Адреса клиентов</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f6f7;
      color: #111;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
    }

    .app {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
    }

    h1 {
      margin: 10px 0 6px;
      font-size: 27px;
    }

    .subtitle {
      color: #666;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 2px 12px rgba(0,0,0,.06);
    }

    .title {
      font-size: 19px;
      font-weight: 800;
      margin-bottom: 14px;
    }

    input[type="file"] {
      width: 100%;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #fff;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: 700;
    }

    button:disabled {
      opacity: .5;
    }

    .status {
      margin-top: 15px;
      padding: 13px;
      border-radius: 10px;
      background: #f1f1f1;
      color: #555;
      line-height: 1.45;
      font-size: 14px;
      word-break: break-word;
    }

    .success {
      background: #e9f7ee;
      color: #176b35;
    }

    .error {
      background: #fdecec;
      color: #9e2020;
    }

    .file-name {
      margin-top: 10px;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>

<body>

<div class="app">

  <h1>Админка адресов</h1>

  <div class="subtitle">
    Тестовая версия — рабочий сайт не затрагивается
  </div>

  <div class="card">

    <div class="title">
      Загрузить новый Excel
    </div>

    <input
      id="fileInput"
      type="file"
      accept=".xlsx,.xls"
    >

    <div
      id="fileName"
      class="file-name"
    >
      Файл не выбран
    </div>

    <button
      id="uploadBtn"
      disabled
    >
      Загрузить Excel
    </button>

    <div
      id="status"
      class="status"
    >
      Выберите Excel-файл.
    </div>

  </div>

</div>


<script>

const API_URL =
  "https://fn.tatnet.cloud/d81fff77-caeb-4e02-b374-407e2b3486f0/f55c92b9-2fb7-44a3-a0b7-0c7bc16ff784";


const fileInput =
  document.getElementById("fileInput");

const fileName =
  document.getElementById("fileName");

const uploadBtn =
  document.getElementById("uploadBtn");

const status =
  document.getElementById("status");


let selectedFile = null;


function setStatus(
  message,
  type = ""
) {

  status.textContent = message;

  status.className =
    "status " + type;

}


fileInput.addEventListener(
  "change",
  function() {

    selectedFile =
      this.files[0] || null;

    if (!selectedFile) {

      fileName.textContent =
        "Файл не выбран";

      uploadBtn.disabled = true;

      setStatus(
        "Выберите Excel-файл."
      );

      return;
    }


    fileName.textContent =
      "Выбран: " +
      selectedFile.name;


    uploadBtn.disabled =
      false;


    setStatus(
      "Файл готов к загрузке."
    );

  }
);


uploadBtn.addEventListener(
  "click",
  async function() {

    if (!selectedFile) {
      return;
    }


    uploadBtn.disabled =
      true;


    setStatus(
      "Подготавливаем файл..."
    );


    try {

      const arrayBuffer =
        await selectedFile.arrayBuffer();


      let binary = "";

      const bytes =
        new Uint8Array(
          arrayBuffer
        );


      const chunkSize =
        0x8000;


      for (
        let i = 0;
        i < bytes.length;
        i += chunkSize
      ) {

        const chunk =
          bytes.subarray(
            i,
            Math.min(
              i + chunkSize,
              bytes.length
            )
          );

        binary +=
          String.fromCharCode(
            ...chunk
          );

      }


      const base64 =
        btoa(binary);


      setStatus(
        "Загружаем Excel..."
      );


      const response =
        await fetch(
          API_URL,
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              action:
                "upload",

              filename:
                selectedFile.name,

              file:
                base64

            })
          }
        );


      const text =
        await response.text();


      let data;


      try {

        data =
          JSON.parse(text);

      } catch {

        throw new Error(
          "Backend вернул некорректный ответ: " +
          text
        );

      }


      if (!response.ok) {

        throw new Error(
          data.error ||
          "HTTP " +
          response.status
        );

      }


      if (!data.ok) {

        throw new Error(
          data.error ||
          "Не удалось загрузить файл."
        );

      }


      setStatus(
        "Excel успешно загружен в тестовое хранилище.",
        "success"
      );


    } catch (error) {

      console.error(
        "UPLOAD ERROR:",
        error
      );


      setStatus(
        "Ошибка: " +
        error.message,
        "error"
      );

    } finally {

      uploadBtn.disabled =
        !selectedFile;

    }

  }
);

</script>

</body>
</html>
